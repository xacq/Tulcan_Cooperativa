{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Reportes</h4>
</div>

<form method="get" class="row g-2 mb-3">
  <div class="col-md-5">
    <select class="form-select" name="report" onchange="this.form.submit()">
      {% for key, label in report_options %}
      <option value="{{ key }}" {% if report_type == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-7 d-flex gap-2 justify-content-md-end">
    <button type="submit" class="btn btn-outline-primary">Ver</button>
    <a class="btn btn-success" href="?report={{ report_type }}&format=csv">CSV</a>
    <a class="btn btn-secondary" href="?report={{ report_type }}&format=xlsx">Excel</a>
    <a class="btn btn-danger" href="?report={{ report_type }}&format=pdf">PDF</a>
  </div>
</form>

<div class="table-responsive">
  <table class="table table-striped table-sm align-middle">
    <thead>
      <tr>
        {% for col in columns %}<th>{{ col|title }}</th>{% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in table_rows %}
      <tr>
        {% for value in row %}<td>{{ value|default:"-" }}</td>{% endfor %}
      </tr>
      {% empty %}
      <tr><td colspan="{{ columns|length }}" class="text-muted">No hay datos para este reporte.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
